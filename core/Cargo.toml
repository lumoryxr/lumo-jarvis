[package]
name = "lumo-core"
version = "0.1.0"
edition = "2021"
description = "OS telemetry and Hermes gateway client for Lumo JARVIS."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
futures-util = "0.3"
thiserror = "2"
