[package]
name = "lumo-jarvis"
version = "0.1.0"
description = "Lumo JARVIS — companion desktop app"
authors = ["Lumoryxr"]
edition = "2021"
rust-version = "1.74"

[lib]
name = "lumo_jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumo-jarvis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# M1 real backend crates
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
opt-level = 1
incremental = true